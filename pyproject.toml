[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prosaic-runtime"
version = "0.3.0"
description = "Bounded execution of neutral Prosaic agents on OpenAI-compatible endpoints"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-MIT", "NOTICE.md"]
authors = [{name = "B3 Cognition"}]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
prosaic-runtime = "prosaic_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prosaic_runtime = ["smoke_prose/*.md", "smoke_prose/subagents/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
