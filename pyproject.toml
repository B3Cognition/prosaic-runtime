[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prosaic-runtime"
version = "0.1.0"
description = "Bounded execution of neutral Prosaic agents on OpenAI-compatible endpoints"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "B3 Cognition"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
prosaic-runtime = "prosaic_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
