[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prosaic-runtime"
version = "0.7.1"
description = "Bounded execution of neutral Prosaic agents on OpenAI-compatible and native Anthropic endpoints"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-MIT", "NOTICE.md"]
authors = [{name = "B3 Cognition"}]
dependencies = [
  "prosaic @ git+https://github.com/B3Cognition/prosaic.git@737bc0f4e6b5d3bd7bd370f2c0d408bc89eb494f",
  "PyYAML>=6.0",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
prosaic-runtime = "prosaic_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prosaic_runtime = ["smoke_prose/*.md", "smoke_prose/subagents/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
