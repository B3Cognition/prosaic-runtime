[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "b3-prosaic-runtime"
version = "0.9.23"
description = "Bounded execution of neutral Prosaic agents on OpenAI-compatible and native Anthropic endpoints"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-MIT", "NOTICE.md"]
authors = [{name = "B3 Cognition"}]
dependencies = [
  "b3-prosaic>=0.5.0,<0.6",
  "PyYAML>=6.0",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3.0,<3", "anyio>=4.9,<5", "httpx2>=2.10,<3"]
test = ["pytest>=8", "build>=1.2", "setuptools>=77", "wheel", "packaging>=24", "b3-prosaic-harness==0.9.12"]

[project.scripts]
prosaic-runtime = "prosaic_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prosaic_runtime = ["smoke_prose/*.md", "smoke_prose/subagents/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
