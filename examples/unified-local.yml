# Operator-owned API profile. Set the model and load the secret into the environment.
default_profile: local
allowed_tools: [read_file]
profiles:
  local:
    base_url: http://127.0.0.1:8000/v1
    model: your-tool-calling-model
    api_key_env: LOCAL_LLM_API_KEY
    max_tokens: 2048
    temperature: 0
    features:
      streaming: false
