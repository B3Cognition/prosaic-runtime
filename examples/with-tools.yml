default_profile: small
allowed_tools: [read_file]
limits:
  timeout_s: 180
  max_tool_rounds: 4

routes:
  fast: small

profiles:
  small:
    base_url: http://127.0.0.1:8000/v1
    model: your-model
    api_key_env: LOCAL_LLM_API_KEY
    max_tokens: 2048
    features:
      streaming: true
      stream_options: true
