name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: '${{ matrix.os }}'
    strategy:
      matrix:
        os: ['ubuntu-24.04', 'ubuntu-24.04-arm', 'macos-latest']
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - name: Install Runtime and its pinned Python Prosaic dependency
        run: python -m pip install -e '.[test]' build
      - name: Install Linux CLI sandbox backend
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap meson ninja-build pkg-config libcap-dev gcc
          git clone https://github.com/containers/bubblewrap.git "$RUNNER_TEMP/bubblewrap"
          git -C "$RUNNER_TEMP/bubblewrap" checkout --detach 2a76602a8c71f36c1527cf9fc3417d9149822e0c
          meson setup "$RUNNER_TEMP/bubblewrap/_build" "$RUNNER_TEMP/bubblewrap" --prefix=/usr -Dman=disabled -Dtests=false
          meson compile -C "$RUNNER_TEMP/bubblewrap/_build"
          sudo meson install -C "$RUNNER_TEMP/bubblewrap/_build"
      - name: Require an operational sandbox (no skipped Linux security gate)
        run: python -c "from prosaic_runtime import CliSandboxConfig; from prosaic_runtime.sandbox import require_backend; require_backend(CliSandboxConfig(mode='required'))"
      - run: prosaic --version
      - run: pytest
      - run: python -m build
