name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: '${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-24.04', 'ubuntu-24.04-arm', 'macos-latest']
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - name: Install Runtime and its pinned Python Prosaic dependency
        run: python -m pip install -e '.[test]' build
      - name: Install Linux CLI sandbox backend
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap meson ninja-build pkg-config libcap-dev gcc
          git clone https://github.com/containers/bubblewrap.git "$RUNNER_TEMP/bubblewrap"
          git -C "$RUNNER_TEMP/bubblewrap" checkout --detach 2a76602a8c71f36c1527cf9fc3417d9149822e0c
          meson setup "$RUNNER_TEMP/bubblewrap/_build" "$RUNNER_TEMP/bubblewrap" --prefix=/usr -Dman=disabled -Dtests=false
          meson compile -C "$RUNNER_TEMP/bubblewrap/_build"
          sudo meson install -C "$RUNNER_TEMP/bubblewrap/_build"
          # Ubuntu restricts unconfined userns capabilities. Permit only the
          # trusted broker on this disposable runner; never disable the sysctl.
          sudo install -m 0644 .github/ci/bwrap.apparmor /etc/apparmor.d/prosaic-ci-bwrap
          sudo apparmor_parser -r /etc/apparmor.d/prosaic-ci-bwrap
      - name: Require an operational sandbox (no skipped Linux security gate)
        run: |
          python - <<'PY'
          import os, subprocess, sys, tempfile
          from pathlib import Path
          from types import SimpleNamespace
          from prosaic_runtime import CliSandboxConfig
          from prosaic_runtime.sandbox import require_backend, _linux_command
          try:
              require_backend(CliSandboxConfig(mode='required'))
          except Exception:
              if sys.platform == 'linux':
                  subprocess.run(['/usr/bin/bwrap', '--version'], check=False)
                  with tempfile.TemporaryDirectory() as temporary:
                      root = Path(temporary).resolve()
                      args = _linux_command([sys.executable, '-c', 'pass'], '/',
                          SimpleNamespace(read_roots=(), forbidden_roots=()),
                          SimpleNamespace(runtime_roots=()), root, root)
                      result = subprocess.run(args, capture_output=True, text=True,
                          env={'PATH': '/usr/bin:/bin', 'PYTHONDONTWRITEBYTECODE': '1', 'PYTHONNOUSERSITE': '1'})
                      print('Sandbox probe exit:', result.returncode)
                      print(result.stderr)
              raise
          if sys.platform == 'darwin':
              from prosaic_runtime.sandbox import sandbox_command
              with sandbox_command([sys.executable, '-c', 'pass'], cwd='/', env={},
                  policy=SimpleNamespace(read_roots=(), forbidden_roots=()),
                  config=CliSandboxConfig(mode='required')) as (argv, env):
                  result = subprocess.run(argv, cwd='/', capture_output=True, text=True, env=env)
                  print('Python sandbox probe exit:', result.returncode)
                  print(result.stderr)
                  if result.returncode:
                      raise RuntimeError('trusted Python cannot start in sandbox')
          PY
      - run: prosaic --version
      - run: pytest
      - run: python -m build

  metering-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: metering-ci-only
          POSTGRES_DB: metering_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build core and separately installed recorder
        run: |
          python -m pip install build pytest
          python -m build
          python -m build adapters/postgres
      - name: Install release wheels
        run: |
          python -m pip install dist/prosaic_runtime-0.6.0-py3-none-any.whl
          python -m pip install adapters/postgres/dist/prosaic_runtime_postgres-0.1.0-py3-none-any.whl
      - name: Required real-database accounting tests
        env:
          METERING_TEST_DSN: postgresql://postgres:metering-ci-only@127.0.0.1:5432/metering_test
          PYTHONPATH: tests
        run: |
          # Upstream CI must not depend on an unreleased downstream consumer.
          python -m pytest adapters/postgres/tests -q -k 'not harness_resume'
