name: Tool contract candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build 'setuptools>=77' wheel packaging pytest
      - name: Build exact source once
        run: python scripts/release_artifacts.py build --ref '${{ github.sha }}' --output candidate --project . --expect b3-prosaic-runtime=0.9.20
      - name: Install original candidate bytes outside checkout
        run: |
          python -m venv /tmp/tool-contract-runtime
          /tmp/tool-contract-runtime/bin/python -m pip install candidate/artifacts/*.whl
          /tmp/tool-contract-runtime/bin/python -m pip check
      - name: Qualify installed consumer
        run: python scripts/release_artifacts.py qualify --directory candidate/artifacts --commit '${{ github.sha }}' --label tool-contract-consumer -- /tmp/tool-contract-runtime/bin/python -I scripts/tool_contract_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: qualified-release
          path: candidate/artifacts/
          if-no-files-found: error
